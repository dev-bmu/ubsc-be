# ===== nginx UBSC — dua domain, satu VPS =====
#
# Tempel isi berkas ini ke /etc/nginx/conf.d/nginx.conf (atau `include /var/www/ubsc/ubsc-api/ops/nginx/ubsc.conf;`
# dari situ). Hanya HTTP :80 — blok SSL ditambahkan certbot (`certbot --nginx`) setelah DNS mengarah.
#
#   ubsportcenter.co.id        -> ubsc-landing :3000   (situs publik + area pelanggan)
#   dash.ubsportcenter.co.id   -> ubsc-admin   :3001   (panel staff)
#
# Di KEDUA domain, /api diteruskan ke ubsc-api :4020 supaya browser tetap same-origin: cookie refresh
# httpOnly (Path=/api/auth) hanya berlaku same-origin, dan axios kedua app memakai baseURL '/api'.
# /uploads dan /assets/reels disajikan nginx langsung dari disk — tidak pernah lewat Node
# (lihat ops/ecosystem.config.js dan docs/media.md).

# Koneksi upstream dipakai ulang (keepalive) — hemat handshake per request API.
upstream ubsc_api     { server 127.0.0.1:4020; keepalive 16; }
upstream ubsc_landing { server 127.0.0.1:3000; keepalive 16; }
upstream ubsc_admin   { server 127.0.0.1:3001; keepalive 16; }

# Header proxy yang sama untuk semua lokasi. API memakai `trust proxy 1`, jadi X-Forwarded-* wajib ada
# (rate limit per IP, cookie Secure, redirect OAuth).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------- situs publik ----------
server {
    listen 80;
    server_name ubsportcenter.co.id www.ubsportcenter.co.id;

    # Bukti transfer dan foto member maks 10 MB; sedikit ruang untuk overhead multipart.
    client_max_body_size 12m;

    # API — ubsc-api
    location /api/ {
        proxy_pass http://ubsc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Unggahan publik (gambar CMS, foto member) — langsung dari disk ubsc-api.
    location /uploads/ {
        alias /var/www/ubsc/ubsc-api/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Video berat di luar git (docs/media.md). Nama berkas tidak pernah berubah -> immutable 1 tahun.
    location /assets/reels/ {
        alias /var/www/ubsc/media/reels/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aset build Next ber-hash -> aman di-cache lama.
    location /_next/static/ {
        proxy_pass http://ubsc_landing;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Halaman — ubsc-landing
    location / {
        proxy_pass http://ubsc_landing;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- panel staff ----------
server {
    listen 80;
    server_name dash.ubsportcenter.co.id;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://ubsc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/ubsc/ubsc-api/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://ubsc_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ubsc_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
